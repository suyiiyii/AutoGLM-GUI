name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  # 并行发布 - PyPI 包和所有平台的 Electron 构建
  release-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: ./.github/actions/setup-python

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '20'

      - name: Get Version
        id: version
        run: |
          VERSION=$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          TAG_NAME=${GITHUB_REF#refs/tags/}
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          
          echo "Version: $VERSION"
          echo "Tag: $TAG_VERSION"

      - name: Check Version
        if: steps.version.outputs.VERSION != steps.version.outputs.TAG_VERSION
        run: |
          echo "Version mismatch: ${{ steps.version.outputs.VERSION }} != ${{ steps.version.outputs.TAG_VERSION }}"
          exit 1

      - name: Build Frontend
        env:
          VITE_BACKEND_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd frontend
          pnpm install
          pnpm build

      - name: Copy Static Files
        run: |
          mkdir -p AutoGLM_GUI/static
          cp -r frontend/dist/* AutoGLM_GUI/static/

      - name: Build Package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create Release if not exists
        run: |
          gh release view ${{ steps.version.outputs.TAG_NAME }} || \
          gh release create ${{ steps.version.outputs.TAG_NAME }} \
            --title "${{ steps.version.outputs.TAG_NAME }}" \
            --notes "Release ${{ steps.version.outputs.TAG_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        run: gh release upload --clobber ${{ steps.version.outputs.TAG_NAME }} dist/*.tar.gz dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Electron 构建使用 matrix 策略，与 PyPI 发布并行
  build-electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS
            runs-on: macos-latest
            node-version: '20'
          - os: Windows
            runs-on: windows-latest
            node-version: '24'
          - os: Linux
            runs-on: ubuntu-latest
            node-version: '20'

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: ./.github/actions/setup-python

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache ADB tools
        uses: actions/cache@v4
        with:
          path: resources/adb
          key: ${{ runner.os }}-adb-${{ hashFiles('scripts/download_adb.py') }}
          restore-keys: |
            ${{ runner.os }}-adb-

      - name: Build Electron application
        run: uv run python scripts/build_electron.py

      - name: Get version
        id: version
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload artifacts to release
        shell: bash
        run: |
          TAG_NAME="${{ steps.version.outputs.TAG_NAME }}"
          
          # 根据平台上传不同的文件
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Windows
            for file in electron/dist/*.exe; do
              if [ -f "$file" ]; then
                echo "Uploading: $(basename "$file")"
                gh release upload --clobber "$TAG_NAME" "$file"
              fi
            done
            for file in electron/dist/*.blockmap; do
              if [ -f "$file" ]; then
                echo "Uploading: $(basename "$file")"
                gh release upload --clobber "$TAG_NAME" "$file"
              fi
            done
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # macOS
            for file in electron/dist/*.dmg electron/dist/*.dmg.blockmap; do
              if [ -f "$file" ]; then
                echo "Uploading: $(basename "$file")"
                gh release upload --clobber "$TAG_NAME" "$file"
              fi
            done
          else
            # Linux
            for file in electron/dist/*.{AppImage,deb,tar.gz}; do
              if [ -f "$file" ]; then
                echo "Uploading: $(basename "$file")"
                gh release upload --clobber "$TAG_NAME" "$file"
              fi
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布摘要
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [release-pypi, build-electron]
    if: always()

    steps:
      - name: Create release summary
        run: |
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PyPI Package | ${{ needs.release-pypi.result == 'success' && '✅ Published' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Electron (macOS) | ${{ needs.build-electron.result == 'success' && '✅ Built' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Electron (Windows) | ${{ needs.build-electron.result == 'success' && '✅ Built' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Electron (Linux) | ${{ needs.build-electron.result == 'success' && '✅ Built' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.release-pypi.result }}" != "success" ] || [ "${{ needs.build-electron.result }}" != "success" ]; then
            echo "❌ Release had failures"
            exit 1
          else
            echo "✅ Release completed successfully"
          fi
