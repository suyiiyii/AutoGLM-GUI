name: Builds

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    name: Python package with bundled frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: ./.github/actions/setup-python
        with:
          frozen: "true"

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-node
        with:
          node-version: "24"
          install-deps: "false"

      - name: Build frontend and Python package
        run: uv run python scripts/build.py --pack

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-dist
          path: dist/
          retention-days: 7

  build-windows:
    name: Electron for Windows
    uses: ./.github/workflows/_electron-build.yml
    with:
      platform: windows
      publish_mode: never
      upload_artifacts: true
      node_version: "24"

  build-macos:
    name: Electron for macOS (ARM64)
    uses: ./.github/workflows/_electron-build.yml
    with:
      platform: macos-arm64
      publish_mode: never
      upload_artifacts: true

  build-macos-x64:
    name: Electron for macOS (x64)
    uses: ./.github/workflows/_electron-build.yml
    with:
      platform: macos-x64
      publish_mode: never
      upload_artifacts: true

  build-linux:
    name: Electron for Linux
    uses: ./.github/workflows/_electron-build.yml
    with:
      platform: linux
      publish_mode: never
      upload_artifacts: true

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - python-package
      - build-windows
      - build-macos
      - build-macos-x64
      - build-linux
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "Python package: ${{ needs.python-package.result }}"
          echo "Windows build: ${{ needs.build-windows.result }}"
          echo "macOS ARM64 build: ${{ needs.build-macos.result }}"
          echo "macOS x64 build: ${{ needs.build-macos-x64.result }}"
          echo "Linux build: ${{ needs.build-linux.result }}"

          if [ "${{ needs.python-package.result }}" != "success" ] || [ "${{ needs.build-windows.result }}" != "success" ] || [ "${{ needs.build-macos.result }}" != "success" ] || [ "${{ needs.build-macos-x64.result }}" != "success" ] || [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "Some builds failed"
            exit 1
          else
            echo "All builds succeeded"
          fi
