name: Build Electron App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'

jobs:
  # 快速检查 - 在构建前验证代码质量
  quick-check:
    name: Quick Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: ./.github/actions/setup-python

      - name: Quick lint check
        run: |
          uv run ruff check --select=E9,F63,F7,F82 --output-format=github

  # 主构建任务 - 使用 matrix 策略
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    needs: quick-check

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runs-on: windows-latest
            node-version: '24'
          - os: macOS
            runs-on: macos-latest
            node-version: '20'
          - os: Linux
            runs-on: ubuntu-22.04
            node-version: '20'

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 使用统一的 composite action
      - name: Setup Python & uv
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      # 依赖缓存已在 setup-node-pnpm 和 setup-python action 中处理|      # 依赖缓存已在 setup-node-pnpm 和 setup-python action 中处理

      # 构建应用
      - name: Build application
        run: uv run python scripts/build_electron.py

      # 列出构建产物
      - name: List dist directory
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell -Command "Get-ChildItem -Path electron\dist -Recurse -File | Select-Object FullName, @{Name='Size(MB)';Expression={[math]::Round($_.Length/1MB, 2)}}"
          else
            ls -lh electron/dist/
          fi
        shell: bash

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: electron/dist/*
          retention-days: 7
          if-no-files-found: error

  # 汇总构建结果
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # 检查每个构建的结果
          results='${{ needs.build.result }}'
          if [ "$results" = "success" ]; then
            echo "| Windows | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| macOS | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| Linux | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Windows | ❌ |" >> $GITHUB_STEP_SUMMARY
            echo "| macOS | ❌ |" >> $GITHUB_STEP_SUMMARY
            echo "| Linux | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$results" != "success" ]; then
            echo "❌ Some builds failed"
            exit 1
          fi
