name: PR Lint & Format Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 使用统一的 composite action
      - name: Setup Python & uv
        uses: ./.github/actions/setup-python

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '20'

      - name: Run unified lint script
        run: |
          echo "Running unified lint script in check-only mode..."
          uv run python scripts/lint.py --check-only

      - name: Check backend formatting
        run: |
          echo "Checking backend Python code..."
          uv run ruff check --output-format=github
          uv run ruff format --check --diff

      - name: Check frontend formatting
        run: |
          echo "Checking frontend code..."
          cd frontend
          pnpm lint
          pnpm format:check
          pnpm type-check

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ There are uncommitted changes after running formatters!"
            echo ""
            echo "Please run locally to fix:"
            echo "  uv run python scripts/lint.py"
            exit 1
          fi

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Lint & Format Check Results')
            );

            const status = '${{ job.status }}' === 'success' ? '✅ PASSED' : '❌ FAILED';

            const commentBody = `
            ## 🚀 Lint & Format Check Results: ${status}

            ### What was checked:
            - 🐍 **Backend**: Ruff linting + formatting
            - 📱 **Frontend**: ESLint + Prettier + TypeScript types
            - 🔧 **Unified**: Custom lint script validation

            ${{ job.status == 'success' ? '### ✅ All checks passed!' : '### ❌ Some checks failed!\n\nRun locally: `uv run python scripts/lint.py`' }}

            ---
            *This is an automated check.*
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

  # 构建检查 - 只在 lint 通过后运行
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          pnpm build
