name: Setup Python & uv
description: Setup Python and uv package manager

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.11"
  
  install-dependencies:
    description: Whether to install dependencies with uv sync
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: |
        if [ -f uv.lock ]; then
          uv sync
        else
          uv pip install -e .
        fi
