name: Setup Node.js & pnpm
description: Setup Node.js and pnpm with caching and dependency installation

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: "20"
  
  install-dependencies:
    description: Whether to install dependencies with pnpm install
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: 'frontend/pnpm-lock.yaml'

    - name: Install frontend dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: |
        cd frontend
        pnpm install --frozen-lockfile
